spring.application.name=lab15

server.port=3000

# ---------- MySQL (Aiven) ----------
# Credentials are NOT stored in the repository. Set these environment variables
# with the values from your Aiven service page before running (see README.md):
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME:se411db}?sslMode=REQUIRED
spring.datasource.username=${DB_USER:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# run schema.sql and data.sql on every start (needed for a non-embedded database)
spring.sql.init.mode=always
