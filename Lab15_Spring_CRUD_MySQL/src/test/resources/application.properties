# Tests run against an in-memory H2 database in MySQL compatibility mode,
# so "mvn package" works without the Aiven server or its credentials.
spring.datasource.url=jdbc:h2:mem:lab15test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
